name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: uv.lock
      - name: Install project and development tools
        run: |
          python -m pip install uv==0.12.14
          uv sync --frozen --extra dev
      - name: Lint
        run: uv run --no-sync python -m ruff check .
      - name: Fast test and coverage gate
        run: uv run --no-sync python -m pytest tests -m "not slow" --cov
      - name: Archive installation gate
        run: uv run --no-sync python -m pytest tests -m slow

  console:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install console dependencies
        run: npm --prefix web ci
      - name: Typecheck console
        run: npm --prefix web run typecheck
      - name: Build console
        run: npm --prefix web run build
