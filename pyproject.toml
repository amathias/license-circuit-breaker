[project]
name = "license-circuit-breaker"
version = "0.1.0"
description = "Executable data-rights revocation with DataHub"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "networkx>=3.4",
    "duckdb>=1.1",
    "scikit-learn>=1.5",
    "httpx>=0.27",
    # Live DataHub integration. Pinned to the coordinator's DataHub 1.6.0 stack.
    "acryl-datahub>=1.6.0,<1.7",
    "mcp>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.16",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
license-circuit-breaker = "demo.cli:main"

[tool.setuptools]
# `demo` carries the fixture graph and the seed/slice CLI, and `policy` carries
# the rule table. Omitting either produced an installable archive whose CLI was
# missing and whose policy loader had nothing to read.
packages = ["app", "adapters", "demo", "policy"]

[tool.setuptools.package-data]
policy = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "slow: builds a git archive and installs it into an isolated venv (minutes)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "web", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = [
    "S101",  # assert is the idiom pytest is built on
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately construct foreign URNs and fixture credentials to prove
# the guards reject them; those are not real secrets.
"tests/*" = ["S105", "S106"]
# B008 flags calls in argument defaults, which is exactly how FastAPI declares
# request bodies and dependencies. Rewriting them to satisfy the rule would make
# the routes less idiomatic without making them safer.
"app/api.py" = ["B008"]
